<!doctype html>
<meta charset="utf-8">
<title>subtractive-synthesizers.js — showcase</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0b0d11;--panel:#151920;--line:#252b35;--ink:#e9ecf1;--dim:#8b95a3;
        --accent:#ffb454;--accent2:#5ad1ff;--ok:#7ee787;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
  header{padding:26px 24px 16px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.01em}
  h1 span{color:var(--accent)}
  .sub{color:var(--dim);font-size:13px;margin-top:6px}
  .sub b{color:var(--accent2);font-weight:600}
  main{max-width:1020px;margin:0 auto;padding:20px 24px 70px}
  .bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
  button{background:var(--panel);color:var(--ink);border:1px solid var(--line);
         border-radius:7px;padding:10px 16px;font:inherit;cursor:pointer}
  button:hover{border-color:#3a4351}
  #play{background:var(--accent);color:#1a1205;border:0;font-weight:700;min-width:104px}
  #play[disabled]{opacity:.4;cursor:default}
  .tempo{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px}
  input[type=range]{accent-color:var(--accent)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;
        padding:13px 15px;cursor:pointer;transition:border-color .12s,background .12s}
  .card:hover{border-color:#3d4757}
  .card.on{border-color:var(--accent);background:#1d1a14}
  .card h3{margin:0 0 4px;font-size:13.5px;font-weight:600}
  .card.on h3{color:var(--accent)}
  .card p{margin:0;color:var(--dim);font-size:12px;line-height:1.45}
  .viz{margin-top:18px;background:var(--panel);border:1px solid var(--line);
       border-radius:9px;padding:12px}
  canvas{width:100%;height:150px;display:block}
  .steps{display:grid;grid-template-columns:repeat(16,1fr);gap:4px;margin-top:14px}
  .st{height:30px;border-radius:4px;background:#191e26;border:1px solid var(--line)}
  .st.hit{background:#2b3442}
  .st.acc{background:#3a4658}
  .st.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;color:var(--dim);font-size:12px}
  .meta b{color:var(--ok);font-weight:600}
  a{color:var(--accent2)}
</style>

<header>
  <h1>subtractive<span>-synthesizers</span>.js — showcase</h1>
  <div class="sub">Every note below is <b>computed on the fly</b> from oscillators and a
    filter. No samples, no recordings — the whole engine is <b id="size"><!-- generated:bundle-total -->28.9 KB<!-- /generated:bundle-total --></b> gzipped.</div>
</header>

<main>
  <div class="bar">
    <button id="play">▶ Play</button>
    <div class="tempo">tempo
      <input type="range" id="bpm" min="70" max="170" step="1" value="124">
      <output id="bpmOut">124</output> BPM
    </div>
    <div class="tempo" id="status">click Play to start audio</div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="viz">
    <canvas id="scope"></canvas>
    <div class="steps" id="steps"></div>
  </div>

  <div class="meta">
    <div>voices <b id="voices">0</b></div>
    <div>sample rate <b id="sr">—</b></div>
    <div><a href="./index.html">open the full patch editor →</a></div>
  </div>
</main>

<script type="module">
import { createEngine } from "../../packages/core/src/index.js";
import { PRESETS, applyPreset } from "../../packages/core/src/presets.js";
import { PATTERNS } from "./patterns.js";

let engine = null, playing = false, current = "acid";
let step = 0, nextTime = 0, timer = null;
const LOOKAHEAD = 0.12, TICK = 25;

const $ = (id) => document.getElementById(id);
const cards = $("cards"), stepsEl = $("steps");

for (const [key, p] of Object.entries(PRESETS)) {
  const el = document.createElement("div");
  el.className = "card" + (key === current ? " on" : "");
  el.dataset.key = key;
  el.innerHTML = `<h3>${p.label}</h3><p>${p.blurb}</p>`;
  el.onclick = () => selectPatch(key);
  cards.appendChild(el);
}
const stepEls = [];
for (let i = 0; i < 16; i++) {
  const d = document.createElement("div");
  d.className = "st";
  stepsEl.appendChild(d); stepEls.push(d);
}

function drawSteps() {
  const pat = PATTERNS[current].steps;
  stepEls.forEach((el, i) => {
    const s = pat[i];
    el.className = "st" + (s ? (s.a ? " acc" : " hit") : "");
  });
}
function selectPatch(key) {
  current = key;
  for (const c of cards.children) c.classList.toggle("on", c.dataset.key === key);
  drawSteps();
  if (engine) { engine.clear(); applyPreset(engine, key); }
}
drawSteps();

$("bpm").oninput = (e) => { $("bpmOut").value = e.target.value; };

// --- scheduler: classic lookahead. A JS timer decides WHICH notes, the worklet decides
// WHEN, to the frame. The timer only has to be roughly on time.
function schedule() {
  const bpm = Number($("bpm").value);
  const stepDur = 60 / bpm / 4;              // 16th notes
  const pat = PATTERNS[current];
  const events = [];
  while (nextTime < engine.context.currentTime + LOOKAHEAD) {
    const s = pat.steps[step % 16];
    if (s) {
      const notes = Array.isArray(s.n) ? s.n : [s.n];
      const vel = s.a ? 1.0 : 0.68;
      const off = nextTime + stepDur * pat.gate;
      for (const n of notes) {
        events.push({ type: "noteOn", note: n, vel, at: nextTime });
        events.push({ type: "noteOff", note: n, at: off });
      }
    }
    const at = nextTime, idx = step % 16;
    setTimeout(() => highlight(idx),
      Math.max(0, (at - engine.context.currentTime) * 1000));
    nextTime += stepDur;
    step++;
  }
  if (events.length) engine.schedule(events);
}
function highlight(i) {
  stepEls.forEach((el, j) => el.classList.toggle("now", j === i && playing));
}

// --- visualiser
const cv = $("scope"), cx = cv.getContext("2d");
let analyser = null, buf = null;
function resize() {
  const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
  cv.width = r.width * d; cv.height = r.height * d; cx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener("resize", resize);
function draw() {
  requestAnimationFrame(draw);
  if (!analyser) return;
  const w = cv.width / (devicePixelRatio || 1), h = cv.height / (devicePixelRatio || 1);
  cx.clearRect(0, 0, w, h);

  analyser.getByteFrequencyData(buf);
  const bars = 96;
  for (let i = 0; i < bars; i++) {
    // Log frequency axis: a linear one wastes 90% of the width on content nobody hears
    // as pitch, and the filter sweep — the thing worth seeing — happens in the low third.
    const f = Math.pow(i / bars, 2.2);
    const v = buf[Math.min(buf.length - 1, Math.floor(f * buf.length))] / 255;
    const bh = v * h * 0.92;
    cx.fillStyle = `rgba(255,180,84,${0.18 + v * 0.65})`;
    cx.fillRect((i / bars) * w, h - bh, w / bars - 1.5, bh);
  }
  analyser.getByteTimeDomainData(buf);
  cx.beginPath();
  cx.strokeStyle = "#5ad1ff"; cx.lineWidth = 1.6;
  for (let i = 0; i < buf.length; i++) {
    const x = (i / buf.length) * w, y = h / 2 + ((buf[i] - 128) / 128) * h * 0.42;
    i ? cx.lineTo(x, y) : cx.moveTo(x, y);
  }
  cx.stroke();
}
draw();

$("play").onclick = async () => {
  if (!engine) {
    $("play").disabled = true; $("status").textContent = "loading engine…";
    try {
      engine = await createEngine({
        wasmUrl: "../../packages/core/wasm/subtractive_dsp.wasm",
        workletUrl: "../../packages/core/worklet/processor.js",
      });
      await engine.resume();
      analyser = engine.context.createAnalyser();
      analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.72;
      buf = new Uint8Array(analyser.frequencyBinCount);
      engine.node.connect(analyser);
      applyPreset(engine, current);
      engine.onStats = (s) => { $("voices").textContent = s.voices; };
      resize();
      $("sr").textContent = engine.context.sampleRate + " Hz";
      $("status").textContent = "";
      $("play").disabled = false;
    } catch (e) {
      $("status").textContent = "failed: " + e.message;
      $("play").disabled = false; return;
    }
  }
  playing = !playing;
  $("play").textContent = playing ? "■ Stop" : "▶ Play";
  if (playing) {
    step = 0; nextTime = engine.context.currentTime + 0.08;
    timer = setInterval(schedule, TICK);
  } else {
    clearInterval(timer); engine.clear(); highlight(-1);
  }
};

// The size above is generated from scripts/audit/bundle-size-audit.sh, which owns the
// number. Deliberately NOT measured here with CompressionStream: the browser's zlib
// gives a different figure again (26.2 KB against the audit's 25.6), and two published
// numbers that disagree are worse than one number with a single owner.
</script>
