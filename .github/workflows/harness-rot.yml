name: harness-rot
# Half of harness rot is time-based -- deprecated deps, dead links, superseded
# conventions -- and never coincides with a commit that touches the harness.
# A pre-commit hook cannot catch any of it.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/audit/harness-audit.sh
